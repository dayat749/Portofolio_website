
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website_1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101020, #30205c);
      color: white;
      text-align: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .card {
      max-width: 650px;
      margin: 50px auto;
      padding: 35px 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      box-shadow: 0 10px 35px #0004;
    }

    h1 {
      color: #c4b5fd;
    }

    p {
      line-height: 1.7;
    }

    button {
      padding: 12px 22px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s;
    }

    button:hover {
      background: #a78bfa;
      transform: translateY(-3px);
    }

    a {
      color: #c4b5fd;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>✨ Selamat datang ke Website</h1>
    <p>
      Halo! Selamat datang di halaman interaktif saya.
      Jelajahi halaman ini dengan menekan tombol di bawah.
    </p>

    <button onclick="sapaPengunjung()">
      Klik Saya!
    </button>

    <button onclick="gantiTema()">
      Ganti Warna
    </button>

    <p id="pesan">
      Semoga harimu menyenangkan 🌙
    </p>

    <hr>

    <h2>🚀 Project saya</h2>
    <p>HTML • CSS • JavaScript • GitHub</p>

    <a href="https://github.com/" target="_blank">
      Kunjungi GitHub
    </a>
  </div>

  <script>
    function sapaPengunjung() {
      document.getElementById("pesan").textContent =
        "Hai! Terima kasih sudah berkunjung 💜";
    }

    function gantiTema() {
      document.body.style.background =
        "linear-gradient(135deg, #064e3b, #0f766e)";
    }
  </script>
</body>
</html>
